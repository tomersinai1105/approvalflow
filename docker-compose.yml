services:
  redis:
    image: redis:7-alpine

  api-gateway:
    build: .
    command: uvicorn app.gateway.api_gateway:app --host 0.0.0.0 --port 8000
    environment:
      DAPR_BASE_URL: http://api-gateway-dapr:3500
      DAPR_PUBSUB_NAME: pubsub
      DAPR_STATE_STORE_NAME: statestore
      DAPR_SECRET_STORE_NAME: local-secret-store
    depends_on:
      - redis
    ports:
      - "8000:8000"

  api-gateway-dapr:
    image: daprio/daprd:1.14.4
    command:
      [
        "./daprd",
        "--app-id", "api-gateway",
        "--app-port", "8000",
        "--app-channel-address", "api-gateway",
        "--dapr-http-port", "3500",
        "--resources-path", "/components",
        "--config", "/components/config.yaml"
      ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - api-gateway
      - redis

  invoice-service:
    build: .
    command: uvicorn app.microservices.invoice_service.invoice_api:app --host 0.0.0.0 --port 8001
    environment:
      DAPR_BASE_URL: http://invoice-service-dapr:3500
      DAPR_PUBSUB_NAME: pubsub
      DAPR_STATE_STORE_NAME: statestore
      DAPR_SECRET_STORE_NAME: local-secret-store
    depends_on:
      - redis

  invoice-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      [
        "./daprd",
        "--app-id", "invoice-service",
        "--app-port", "8001",
        "--app-channel-address", "invoice-service",
        "--dapr-http-port", "3500",
        "--resources-path", "/components",
        "--config", "/components/config.yaml"
      ]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - invoice-service
      - redis

  workflow-service:
